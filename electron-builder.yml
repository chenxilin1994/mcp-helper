appId: com.mcphelper.app
productName: MCP Helper
directories:
  output: release
files:
  - out/**/*
  - package.json
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: MCP-Helper-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MCP Helper
portable:
  artifactName: MCP-Helper-${version}-portable.${ext}
